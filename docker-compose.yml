services:
  postgres:
    image: postgres:16-alpine
    container_name: tierselect-db
    environment:
      POSTGRES_DB: tierselect
      POSTGRES_USER: tierselect
      POSTGRES_PASSWORD: tierselect123
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/storage/db_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tierselect"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
